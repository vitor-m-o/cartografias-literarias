<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Projetos de Literatura - IF</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- CABEÇALHO OFICIAL (HERO SECTION) -->
    <header class="cabecalho-if">
        <div class="cabecalho-conteudo">
            <img src="cartografias-literarias-logo.png" alt="Logo" class="logo-if">
            <h1> Cartografias Literarias </h1>
            <p>Mapeamento nacional de iniciativas voltadas ao incentivo à leitura.</p>
            
            <!-- Botões das Redes Sociais -->
            <div class="redes-sociais">
                <a href="SEU_LINK_DO_INSTAGRAM_AQUI" target="_blank" class="btn-social btn-insta">Perfil do Instagram</a>
                <a href="https://discord.gg/9tzbybQR4N" target="_blank" class="btn-social btn-discord">Comunidade do Discord</a>
            </div>

            <!-- Galeria de Imagens do Projeto/Instituto -->
            <div class="galeria-topo">
                <img src="ifsul-logo.png" alt="Foto do Instituto">
            </div>
        </div>
    </header>

    <!-- SESSÃO 1: RESUMO DOS DADOS (GRÁFICOS) -->
    <section class="sessao">
        <h2 class="titulo-sessao">Visão Geral dos Dados</h2>
        <div class="dashboard" id="dashboard" style="display: none;">
            <div class="grafico-container"><canvas id="graficoStatus"></canvas></div>
            <div class="grafico-container"><canvas id="graficoTipo"></canvas></div>
            <div class="grafico-container"><canvas id="graficoInstituto"></canvas></div>
        </div>
    </section>

    <!-- SESSÃO 2: PESQUISA E LISTA DE PROJETOS -->
    <section class="sessao">
        <h2 class="titulo-sessao">Explorar Projetos</h2>
        
        <!-- A barra de pesquisa agora fica colada nos projetos -->
        <div class="filtros-container">
            <input type="text" id="busca" placeholder="🔍 Pesquisar por nome ou palavra-chave no resumo..." oninput="aplicarFiltros()">
            
            <select id="filtroInstituto" onchange="aplicarFiltros()">
                <option value="">🏫 Todos os Institutos / Locais</option>
            </select>

            <select id="filtroTipo" onchange="aplicarFiltros()">
                <option value="">📂 Todos os Tipos</option>
            </select>
        </div>

        <div id="projetos">Carregando dados da planilha do Google...</div>
    </section>

    <script>
        // === COLOQUE O SEU LINK AQUI ===
        const urlPlanilha = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS6uBzH5Hh75nEQ1hN2BfQJ0P7ixZtxxOudQWRWlm6ZgiUnT3-1O61538kqXckeM2RXwqGcYMDNNVmO/pub?output=csv"; 
        
        let dadosGlobais = []; 
        let dadosFiltradosAtuais = []; 
        let chartStatus, chartTipo, chartInstituto; 
        let paginaAtual = 1;
        const itensPorPagina = 30; 

        Papa.parse(urlPlanilha, {
            download: true,
            header: true,
            complete: function(resultados) {
                dadosGlobais = resultados.data.filter(linha => linha["INSTITUTO"] && linha["INSTITUTO"].trim() !== "");
                document.getElementById('dashboard').style.display = 'flex';
                preencherOpcoesDosFiltros(dadosGlobais);
                aplicarFiltros(); 
            }
        });

        function preencherOpcoesDosFiltros(dados) {
            let institutos = [...new Set(dados.map(d => d["INSTITUTO"].trim()))].sort();
            
            // Separa os tipos por vírgula para listar apenas os tópicos puros
            let todosOsTipos = [];
            dados.forEach(d => {
                let tipoBruto = d["TIPO"] ? d["TIPO"].trim() : "Não definido";
                let tiposSeparados = tipoBruto.split(',').map(t => t.trim());
                todosOsTipos.push(...tiposSeparados);
            });
            let tiposUnicos = [...new Set(todosOsTipos)].sort();

            let selectInst = document.getElementById("filtroInstituto");
            institutos.forEach(inst => selectInst.innerHTML += `<option value="${inst}">${inst}</option>`);

            let selectTipo = document.getElementById("filtroTipo");
            tiposUnicos.forEach(tipo => selectTipo.innerHTML += `<option value="${tipo}">${tipo}</option>`);
        }

        function aplicarFiltros() {
            let textoBusca = document.getElementById("busca").value.toLowerCase();
            let instSelecionado = document.getElementById("filtroInstituto").value;
            let tipoSelecionado = document.getElementById("filtroTipo").value;

            dadosFiltradosAtuais = dadosGlobais.filter(projeto => {
                let nome = (projeto["NOME PROJETO"] || "").toLowerCase();
                let resumo = (projeto["Resumo"] || "").toLowerCase();
                let instituto = projeto["INSTITUTO"].trim();
                
                let tipoBruto = projeto["TIPO"] ? projeto["TIPO"].trim() : "Não definido";
                let tiposSeparados = tipoBruto.split(',').map(t => t.trim()); // Quebra em lista

                let passaTexto = nome.includes(textoBusca) || resumo.includes(textoBusca);
                let passaInst = instSelecionado === "" || instituto === instSelecionado;
                // Verifica se a lista de tipos do projeto contém o tipo selecionado no filtro
                let passaTipo = tipoSelecionado === "" || tiposSeparados.includes(tipoSelecionado);

                return passaTexto && passaInst && passaTipo;
            });

            paginaAtual = 1; 
            gerarGraficos(dadosFiltradosAtuais);
            mostrarProjetosPaginados();
        }

        function mudarPagina(direcao) {
            paginaAtual += direcao;
            mostrarProjetosPaginados();
            document.getElementById("projetos").scrollIntoView({ behavior: 'smooth' });
        }

        function mostrarProjetosPaginados() {
            const container = document.getElementById("projetos");
            
            if(dadosFiltradosAtuais.length === 0) {
                container.innerHTML = "<h3 style='grid-column: 1 / -1; text-align: center; color: #7f8c8d;'>Nenhum projeto encontrado.</h3>";
                return;
            }

            let inicio = (paginaAtual - 1) * itensPorPagina;
            let fim = inicio + itensPorPagina;
            let projetosDaPagina = dadosFiltradosAtuais.slice(inicio, fim);
            let totalPaginas = Math.ceil(dadosFiltradosAtuais.length / itensPorPagina);

            let htmlFinal = "";

            // 1. DESENHA OS CARTÕES (Dentro do loop)
            projetosDaPagina.forEach(projeto => {
                let instituto = projeto["INSTITUTO"];
                let campus = projeto["CAMPUS"] || "";
                let nomeRaw = projeto["NOME PROJETO"] ? projeto["NOME PROJETO"].trim() : "";
                let resumo = projeto["Resumo"] || "Sem resumo disponível.";
                let link = projeto["REFERÊNCIA"] || "";

                let tipoBruto = projeto["TIPO"] ? projeto["TIPO"].trim() : "Não definido";
                let tiposSeparados = tipoBruto.split(',').map(t => t.trim()).filter(t => t !== ""); 
                
                let tagsHTML = "";
                
                if (tiposSeparados.length === 0) {
                    tagsHTML = `<div class="tipo">Não definido</div>`;
                } else {
                    tiposSeparados.forEach(tag => {
                        let classeTipo = tag.toUpperCase().includes("SEM PROJETO") ? "tipo sem-projeto" : "tipo";
                        tagsHTML += `<div class="${classeTipo}">${tag}</div>`;
                    });
                }

                let linkHTML = link ? `<a href="${link}" target="_blank" class="link">Acessar Referência ➔</a>` : "";
                let tituloHTML = nomeRaw ? `<div class="titulo">${nomeRaw}</div>` : "";

                // Adiciona o HTML do cartão à nossa variável final
                htmlFinal += `
                    <div class="cartao">
                        <div class="instituto">${instituto} ${campus ? '— ' + campus : ''}</div>
                        ${tituloHTML}
                        <div class="tags-container">
                            ${tagsHTML}
                        </div>
                        <div class="resumo">${resumo}</div>
                        ${linkHTML}
                    </div>
                `;
            });

            // 2. DESENHA A PAGINAÇÃO (Fora do loop, no final de tudo)
            htmlFinal += `
                <div class="paginacao">
                    <button class="btn-pagina" onclick="mudarPagina(-1)" ${paginaAtual === 1 ? 'disabled' : ''}>⬅</button>
                    <span id="info-pagina">
                        Pág <input type="number" id="input-pagina" value="${paginaAtual}" min="1" max="${totalPaginas}" onchange="irParaPagina(this.value, ${totalPaginas})"> de ${totalPaginas}
                    </span>
                    <button class="btn-pagina" onclick="mudarPagina(1)" ${paginaAtual === totalPaginas ? 'disabled' : ''}>➡</button>
                </div>
            `;
            
            // 3. JOGA NA TELA
            container.innerHTML = htmlFinal;
        }

        // NOVA FUNÇÃO: Pula direto para a página digitada
        function irParaPagina(valor, maximo) {
            let novaPagina = parseInt(valor);
            if (novaPagina >= 1 && novaPagina <= maximo) {
                paginaAtual = novaPagina;
                mostrarProjetosPaginados();
                document.getElementById("projetos").scrollIntoView({ behavior: 'smooth' });
            } else {
                alert("Página inválida!");
                mostrarProjetosPaginados(); // Reseta o input caso digite errado
            }
        }

        function gerarGraficos(dados) {
            let contagemTipos = {};
            let contagemInstitutos = {};
            let contagemStatus = { "Com Projeto": 0, "Sem Projeto": 0 };

            dados.forEach(linha => {
                let tipoBruto = linha["TIPO"] ? linha["TIPO"].trim() : "Não definido";
                let instituto = linha["INSTITUTO"] ? linha["INSTITUTO"].trim() : "";
                
                // Adiciona +1 para cada tópico isolado encontrado na célula
                let tiposSeparados = tipoBruto.split(',').map(t => t.trim());
                tiposSeparados.forEach(t => {
                    if (t) contagemTipos[t] = (contagemTipos[t] || 0) + 1;
                });

                contagemInstitutos[instituto] = (contagemInstitutos[instituto] || 0) + 1;
                
                if (tipoBruto.toUpperCase().includes("SEM PROJETO")) {
                    contagemStatus["Sem Projeto"]++;
                } else {
                    contagemStatus["Com Projeto"]++;
                }
            });

            if(chartStatus) chartStatus.destroy();
            if(chartTipo) chartTipo.destroy();
            if(chartInstituto) chartInstituto.destroy();

            Chart.defaults.font.family = "'Segoe UI', sans-serif";
            Chart.defaults.color = '#333';

            chartStatus = new Chart(document.getElementById('graficoStatus'), {
                type: 'pie',
                data: { labels: Object.keys(contagemStatus), datasets: [{ data: Object.values(contagemStatus), backgroundColor: ['#2F9E41', '#E02041'] }] },
                options: { plugins: { title: { display: true, text: 'Campi Com vs Sem Projeto', font: {size: 16} } } }
            });

            chartTipo = new Chart(document.getElementById('graficoTipo'), {
                type: 'doughnut',
                data: { labels: Object.keys(contagemTipos), datasets: [{ data: Object.values(contagemTipos), backgroundColor: ['#2980b9', '#f39c12', '#8e44ad', '#2c3e50', '#16a085', '#d35400', '#27ae60'] }] },
                options: { plugins: { title: { display: true, text: 'Projetos por Categoria', font: {size: 16} } } }
            });

            chartInstituto = new Chart(document.getElementById('graficoInstituto'), {
                type: 'bar',
                data: { labels: Object.keys(contagemInstitutos), datasets: [{ label: 'Qtd', data: Object.values(contagemInstitutos), backgroundColor: '#2F9E41' }] },
                options: { scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }, plugins: { title: { display: true, text: 'Registros por Local', font: {size: 16} }, legend: { display: false } } }
            });
        }
    </script>
</body>
</html>
